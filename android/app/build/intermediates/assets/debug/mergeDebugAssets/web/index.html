<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <title>LinguaAI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <div>
          <h1>LinguaAI</h1>
          <p class="tagline">AI grammar &amp; writing assistant</p>
        </div>
      </div>
      <button class="icon-btn" id="pasteBtn" title="Paste">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        </svg>
      </button>
    </header>

    <div class="score-bar" id="scoreBar" style="display:none;">
      <div class="score-ring" id="scoreRing">
        <span id="scoreValue">—</span>
      </div>
      <div class="score-meta">
        <span class="score-label">Writing Score</span>
        <span class="score-issues" id="scoreIssues">No issues</span>
      </div>
      <button class="btn-primary" id="acceptAll" style="display:none;">Accept all</button>
    </div>

    <div class="editor">
      <textarea id="editor" placeholder="Type or paste text to check grammar, spelling, vocabulary, tone, and style..."></textarea>
    </div>

    <div class="quick-stats" id="quickStats">0 words · 0 chars · 0 sec</div>

    <div class="tabs">
      <button class="tab active" data-tab="issues">Issues <span class="count" id="issuesCount"></span></button>
      <button class="tab" data-tab="vocab">Vocab <span class="count" id="vocabCount"></span></button>
      <button class="tab" data-tab="tone">Tone</button>
      <button class="tab" data-tab="stats">Stats</button>
    </div>

    <div class="panel" id="panel">
      <div class="tab-content active" id="tab-issues">
        <div class="empty">
          <div class="empty-icon">✦</div>
          <p>Start typing to see grammar suggestions.</p>
        </div>
      </div>
      <div class="tab-content" id="tab-vocab"></div>
      <div class="tab-content" id="tab-tone"></div>
      <div class="tab-content" id="tab-stats"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
