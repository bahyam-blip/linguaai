name: Build LinguaAI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # --------------- Web app build ---------------
  build-web:
    name: Build Next.js web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build web app
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: bun run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguaai-web
          path: |
            .next/standalone
            .next/static
            public

  # --------------- Android APK build ---------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Zip-align APK
        working-directory: android
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -p 4 \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Re-sign APK with v2+v3 signature schemes
        working-directory: android
        env:
          KEYSTORE_PASS: linguaai2026
          KEY_PASS: linguaai2026
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks linguaai-release.keystore \
            --ks-pass pass:linguaai2026 \
            --key-pass pass:linguaai2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/release/LinguaAI-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose \
            app/build/outputs/apk/release/LinguaAI-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguaai-apk
          path: android/app/build/outputs/apk/release/LinguaAI-release.apk

  # --------------- Package the extension ---------------
  package-extension:
    name: Package browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension
        run: |
          cd extension
          zip -r ../LinguaAI-Extension-v1.0.0.zip .
          cd ..

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: linguaai-extension
          path: LinguaAI-Extension-v1.0.0.zip

  # --------------- Release on tag push ---------------
  release:
    name: Release
    needs: [build-web, build-android, package-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts for release
        run: |
          mkdir -p release
          cp artifacts/linguaai-apk/app-debug.apk release/LinguaAI-${{ github.ref_name }}.apk
          cp artifacts/linguaai-extension/LinguaAI-Extension-v1.0.0.zip release/
          zip -r release/LinguaAI-source-${{ github.ref_name }}.zip . \
            -x '.git/*' 'node_modules/*' '.next/*' 'android/.gradle/*' 'android/app/build/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LinguaAI-${{ github.ref_name }}.apk
            release/LinguaAI-Extension-v1.0.0.zip
            release/LinguaAI-source-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
