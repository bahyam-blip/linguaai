name: Build LinguaAI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # --------------- Web app build ---------------
  build-web:
    name: Build Next.js web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: bun install
      - run: bun run lint
      - run: bun run build

  # --------------- Android APK build ---------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-34 build-tools;34.0.0' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - working-directory: android
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -p 4 \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
      - working-directory: android
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks linguaai-release.keystore --ks-pass pass:linguaai2026 \
            --key-pass pass:linguaai2026 --v1-signing-enabled true \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out app/build/outputs/apk/release/LinguaAI-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: linguaai-apk
          path: android/app/build/outputs/apk/release/LinguaAI-release.apk

  # --------------- Package the extension ---------------
  package-extension:
    name: Package browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd extension && zip -r ../LinguaAI-Extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linguaai-extension
          path: LinguaAI-Extension.zip

  # --------------- Release on tag push ---------------
  release:
    name: Release
    needs: [build-web, build-android, package-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: |
          mkdir -p release
          cp artifacts/linguaai-apk/LinguaAI-release.apk release/LinguaAI-${{ github.ref_name }}.apk
          cp artifacts/linguaai-extension/LinguaAI-Extension.zip release/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LinguaAI-${{ github.ref_name }}.apk
            release/LinguaAI-Extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
